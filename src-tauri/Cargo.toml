[package]
name = "oa-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "驭工 OA · Tauri 2.0 thin client shell (REST only)"

[lib]
name = "oa_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# 自动更新：客户端启动后拉 Release 上的 latest.json，按签名校验安装包
tauri-plugin-updater = "2"
# generate_context! 反序列化 tauri.conf.json 的 plugins 段时会引用 serde_json，
# 不显式声明就报 E0433（宏展开处找不到该 crate）
serde_json = "1"
